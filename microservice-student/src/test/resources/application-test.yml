spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:student_test_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

eureka:
  client:
    enabled: false
